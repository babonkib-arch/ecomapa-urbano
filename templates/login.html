<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - EcoMapa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #09150d;
            overflow: hidden;
        }
        .login-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, rgba(19, 78, 50, 0.5) 0%, rgba(9, 21, 13, 0.98) 80%);
            position: relative;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(32, 201, 151, 0.25);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            z-index: 10;
        }
        .login-logo {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #198754, #20c997);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(25, 135, 84, 0.4);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #20c997;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-success-pro {
            background: linear-gradient(135deg, #198754, #157347);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-success-pro:hover {
            background: linear-gradient(135deg, #157347, #115c37);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.4);
        }
        .ambient-particle {
            position: absolute;
            background: rgba(32, 201, 151, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper" id="particlesContainer">
        <div class="login-card">
            <div class="login-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="text-center fw-bold mb-1">Portal Municipal</h3>
            <p class="text-center text-muted small mb-4">EcoMapa Fray Bentos - Gestión Interna</p>

            {% if error %}
                <div class="alert alert-danger bg-danger text-white border-0 py-2 small rounded-3 mb-3 text-center">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: rgba(255,255,255,0.15);"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="admin@ecomapa.com" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: rgba(255,255,255,0.15);"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>
                <button type="submit" class="btn btn-success-pro w-100 text-white mb-3">Iniciar Sesión</button>
            </form>
            <div class="text-center">
                <a href="/" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Mapa Público</a>
            </div>
        </div>
    </div>

    <script>
        // Generador de partículas ambientales de fondo
        const container = document.getElementById('particlesContainer');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'ambient-particle';
            const size = Math.random() * 6 + 4;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${6 + Math.random() * 6}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(p);
        }
    </script>
</body>
</html>
