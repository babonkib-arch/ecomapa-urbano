<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administración - EcoMapa FB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-900 border border-slate-800 max-w-md w-full rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-black text-white tracking-wide">Panel de Administración</h2>
            <p class="text-xs text-slate-400">Acceso restringido para personal autorizado.</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500 text-xs"></i>
                    <input type="email" id="email" required placeholder="admin@ecomapa.org" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-xs"></i>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl transition flex items-center justify-center gap-2 text-xs uppercase tracking-wider shadow-lg shadow-emerald-950">
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-xs text-emerald-400 hover:underline font-bold flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Volver al Mapa Principal
            </a>
        </div>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Verificando...`;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = data.redirect || '/admin';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Denegado',
                        text: data.error || 'Credenciales incorrectas',
                        background: '#0f172a',
                        color: '#f8fafc',
                        confirmButtonColor: '#10b981'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Conexión',
                    text: 'No se pudo conectar con el servidor',
                    background: '#0f172a',
                    color: '#f8fafc',
                    confirmButtonColor: '#10b981'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Iniciar Sesión</span>`;
            }
        });
    </script>
</body>
</html>
