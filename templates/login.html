<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Administrador - EcoMapa Fray Bentos</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #111d15;
            background-image: radial-gradient(circle at 10% 20%, rgba(25, 135, 84, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(32, 201, 151, 0.1) 0%, transparent 40%);
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .form-control {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success p-3 rounded-circle mb-3" style="width: 65px; height: 65px;">
                    <i class="fa-solid fa-lock fs-4"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Portal de Administradores</h3>
                <p class="text-muted small mb-0">EcoMapa Fray Bentos</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">📧 CORREO ELECTRÓNICO</label>
                    <input type="email" name="email" class="form-control" placeholder="admin@ecomapa.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">🔑 CONTRASEÑA</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm mb-3">
                    Iniciar Sesión
                </button>

                <div class="text-center">
                    <a href="/" class="text-muted small text-decoration-none">
                        <i class="fa-solid fa-arrow-left me-1"></i> Volver al mapa público
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
