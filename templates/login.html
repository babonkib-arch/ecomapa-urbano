<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - EcoMapa Fray Bentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #09150d;
            overflow: hidden;
        }

        /* Fondo ambiental con efecto corporativo y partículas idéntico al sistema público */
        .login-wrapper {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09150d;
            background-image: radial-gradient(circle at 50% 30%, rgba(19, 78, 50, 0.45) 0%, rgba(9, 21, 13, 0.98) 75%);
            overflow: hidden;
        }

        .ambient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        .falling-element {
            position: absolute;
            top: -10vh;
            animation: fallDown linear infinite;
            opacity: 0.6;
        }
        @keyframes fallDown {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* Tarjeta de Login Glassmorphism refinada */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(13, 33, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(32, 201, 151, 0.3);
            border-radius: 28px;
            padding: 45px 35px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #134e32 0%, #198754 50%, #0f3d27 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #20c997;
            margin: 0 auto 20px auto;
            box-shadow: 0 12px 30px rgba(25, 135, 84, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(32, 201, 151, 0.4);
        }

        .form-label {
            color: #a8dadc;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #20c997;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.06) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: #20c997 !important;
            border-radius: 12px 0 0 12px !important;
        }

        .btn-success-pro {
            background: linear-gradient(135deg, #198754, #157347);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(25, 135, 84, 0.4);
        }
        .btn-success-pro:hover {
            background: linear-gradient(135deg, #157347, #115c37);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(25, 135, 84, 0.6);
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="ambient-bg" id="ambientBg"></div>

        <div class="login-card">
            <div class="login-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="text-center fw-bold mb-1">Portal Municipal</h3>
            <p class="text-center text-muted small mb-4" style="color: #a8dadc !important;">EcoMapa Fray Bentos - Seguridad</p>

            {% if error %}
                <div class="alert alert-danger bg-danger bg-opacity-75 text-white border-0 py-2 small rounded-3 mb-3 text-center">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="admin@ecomapa.com" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>
                <button type="submit" class="btn btn-success-pro w-100 mb-3">Iniciar Sesión</button>
            </form>
            <div class="text-center">
                <a href="/" class="text-decoration-none small" style="color: #20c997;"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Mapa Público</a>
            </div>
        </div>
    </div>

    <script>
        // Generador de iconos flotantes en el fondo idénticos al mapa principal
        document.addEventListener('DOMContentLoaded', () => {
            const bg = document.getElementById('ambientBg');
            const iconos = ['fa-leaf', 'fa-plus', 'fa-seedling', 'fa-shield'];
            for (let i = 0; i < 16; i++) {
                const el = document.createElement('i');
                el.className = `fa-solid ${iconos[Math.floor(Math.random() * iconos.length)]} falling-element`;
                el.style.left = `${Math.random() * 100}%`;
                el.style.animationDuration = `${7 + Math.random() * 6}s`;
                el.style.animationDelay = `${Math.random() * 4}s`;
                el.style.fontSize = `${14 + Math.random() * 14}px`;
                el.style.color = `rgba(32, 201, 151, ${0.2 + Math.random() * 0.3})`;
                bg.appendChild(el);
            }
        });
    </script>
</body>
</html>
