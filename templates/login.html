<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - EcoMapa Fray Bentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #09150d;
            overflow: hidden;
        }

        /* Pantalla de carga inicial */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #09150d;
            background-image: radial-gradient(circle at 50% 30%, rgba(19, 78, 50, 0.5) 0%, rgba(9, 21, 13, 0.99) 70%);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #introScreen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-bar-container {
            width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 25px auto 0 auto;
            overflow: hidden;
            border: 1px solid rgba(32, 201, 151, 0.2);
        }
        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #198754, #20c997);
            border-radius: 10px;
            transition: width 0.08s linear;
        }

        /* Contenedor del Login Profesional */
        .login-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, rgba(19, 78, 50, 0.4) 0%, rgba(9, 21, 13, 0.98) 80%);
            position: relative;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(32, 201, 151, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            color: #ffffff;
            z-index: 10;
        }
        .login-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #198754, #20c997);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(25, 135, 84, 0.4);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #20c997;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-success-pro {
            background: linear-gradient(135deg, #198754, #157347);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-success-pro:hover {
            background: linear-gradient(135deg, #157347, #115c37);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.4);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Carga Inicial -->
    <div id="introScreen">
        <div class="text-center">
            <div class="login-logo mb-3">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="fw-bold mb-1">EcoMapa Fray Bentos</h2>
            <p class="text-muted small mb-4">Cargando protocolo de seguridad municipal...</p>
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
        </div>
    </div>

    <!-- Página de Login Profesional -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h3 class="text-center fw-bold mb-1">Portal Municipal</h3>
            <p class="text-center text-muted small mb-4">Identificación de Administrador</p>

            {% if error %}
                <div class="alert alert-danger bg-danger text-white border-0 py-2 small rounded-3 mb-3 text-center">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: rgba(255,255,255,0.15);"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="admin@ecomapa.com" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: rgba(255,255,255,0.15);"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required style="border-radius: 0 12px 12px 0;">
                    </div>
                </div>
                <button type="submit" class="btn btn-success-pro w-100 text-white mb-3">Iniciar Sesión</button>
            </form>
            <div class="text-center">
                <a href="/" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Mapa Público</a>
            </div>
        </div>
    </div>

    <script>
        // Animación de la barra de carga inicial antes de mostrar el login
        window.addEventListener('DOMContentLoaded', () => {
            let barra = document.getElementById('loadingBarFill');
            let progreso = 0;
            let intervalo = setInterval(() => {
                progreso += 4;
                barra.style.width = progreso + '%';
                if (progreso >= 100) {
                    clearInterval(intervalo);
                    document.getElementById('introScreen').classList.add('fade-out');
                }
            }, 30);
        });
    </script>
</body>
</html>
