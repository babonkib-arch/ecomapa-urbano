<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoMapa Fray Bentos | Reporte Ciudadano</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* Altura adaptada a pantallas móviles */
        #map {
            height: calc(100vh - 4.5rem);
            width: 100%;
            z-index: 10;
        }

        /* Animación del Tick Verde */
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #22c55e;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        @keyframes scale {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.1, 1.1, 1); }
        }

        .animate-success-bounce {
            animation: scale 0.5s ease-in-out 0.9s both;
        }

        /* Transición suavizada para Bottom Sheet en celular */
        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Navegación Móvil Superior -->
    <header class="fixed top-0 inset-x-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-white h-16 flex items-center justify-between px-4">
        <a href="#" class="flex items-center space-x-2.5">
            <div class="w-9 h-9 bg-brand-500 rounded-xl flex items-center justify-center text-white text-base shadow-md shadow-brand-500/30">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <div>
                <span class="text-base font-black tracking-tight block leading-none">EcoMapa <span class="text-brand-400">FB</span></span>
                <span class="text-[10px] text-slate-400 font-medium">Fray Bentos Sustentable</span>
            </div>
        </a>

        <a href="/login" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 active:scale-95">
            <i class="fa-solid fa-user-shield text-brand-400"></i>
            <span>Admin</span>
        </a>
    </header>

    <!-- Contenedor del Mapa (Ocupa la pantalla) -->
    <main class="pt-16 relative">
        <div id="map"></div>

        <!-- Indicador Flotante para tocar el mapa -->
        <div id="instruction-badge" class="fixed top-20 inset-x-4 z-30 pointer-events-none flex justify-center">
            <span class="bg-slate-900/85 backdrop-blur-md text-white border border-slate-700/80 px-4 py-2 rounded-full text-xs font-semibold shadow-xl flex items-center space-x-2 animate-bounce">
                <i class="fa-solid fa-hand-pointer text-brand-400"></i>
                <span>Toca cualquier punto en el mapa para reportar</span>
            </span>
        </div>
    </main>

    <!-- Bottom Sheet / Panel Deslizante de Reporte (Animado) -->
    <div id="report-sheet" class="bottom-sheet fixed inset-x-0 bottom-0 z-50 transform translate-y-full max-h-[88vh] bg-white rounded-t-3xl shadow-2xl flex flex-col border-t border-slate-200">
        
        <!-- Barra Táctil Superior (Handle) -->
        <div class="p-3 flex flex-col items-center justify-center cursor-pointer border-b border-slate-100" onclick="cerrarMenuReporte()">
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mb-1"></div>
            <div class="w-full flex items-center justify-between px-2">
                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center">
                    <i class="fa-solid fa-location-dot text-brand-600 mr-1.5"></i> Nuevo Incidente
                </span>
                <button type="button" class="w-7 h-7 bg-slate-100 rounded-full text-slate-500 font-bold text-xs flex items-center justify-center">✕</button>
            </div>
        </div>

        <!-- Formulario Deslizable -->
        <div class="p-5 overflow-y-auto space-y-4 touch-pan-y">
            <form id="form-reporte-mobile" class="space-y-3.5">
                <!-- Coordenadas ocultas pero dinámicas -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Latitud</label>
                        <input type="text" id="latitud" readonly required class="w-full bg-slate-100 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-mono text-slate-600">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Longitud</label>
                        <input type="text" id="longitud" readonly required class="w-full bg-slate-100 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-mono text-slate-600">
                    </div>
                </div>

                <!-- Título -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Título del problema <span class="text-rose-500">*</span></label>
                    <input type="text" id="titulo" required placeholder="Ej: Basura acumulada en la esquina" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>

                <!-- Categoría y Gravedad -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Categoría</label>
                        <select id="categoria" required class="w-full border border-slate-200 rounded-xl px-2.5 py-2.5 text-xs bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="Residuos">Residuos</option>
                            <option value="Saneamiento">Saneamiento</option>
                            <option value="Alumbrado">Alumbrado</option>
                            <option value="Espacios Verdes">Espacios Verdes</option>
                            <option value="Vialidad">Vialidad</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Gravedad</label>
                        <select id="gravedad" required class="w-full border border-slate-200 rounded-xl px-2.5 py-2.5 text-xs bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta (Urgente)</option>
                        </select>
                    </div>
                </div>

                <!-- Descripción -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Descripción</label>
                    <textarea id="descripcion" rows="2" required placeholder="Detalles de lo sucedido..." class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
                </div>

                <!-- Botón Directo de Cámara -->
                <div class="bg-slate-50 p-3 rounded-2xl border border-dashed border-slate-300">
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center">
                        <i class="fa-solid fa-camera text-brand-600 mr-1.5 text-sm"></i> Fotografiar Incidente
                    </label>
                    <input type="file" id="input-foto" accept="image/*" capture="environment" 
                           class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-100 file:text-brand-800 hover:file:bg-brand-200 cursor-pointer">
                    
                    <div id="preview-container" class="mt-2 hidden">
                        <img id="foto-preview" class="w-full h-28 object-cover rounded-xl border border-slate-200 shadow-sm">
                    </div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" id="btn-submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-brand-600/30 flex items-center justify-center space-x-2 active:scale-95">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Publicar Reporte Ciudadano</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Modal de Éxito Premium con Tick Verde Animado -->
    <div id="modal-success" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-slate-100 animate-success-bounce">
            
            <!-- SVG Tick Verde Animado -->
            <div class="w-20 h-20 mx-auto mb-4 flex items-center justify-center">
                <svg class="w-20 h-20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>

            <h3 class="text-xl font-black text-slate-900 mb-1">¡Reporte Enviado!</h3>
            <p class="text-xs text-slate-500 leading-relaxed mb-6">Tu contribución fue registrada con éxito en el mapa de Fray Bentos.</p>

            <button onclick="cerrarModalExito()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl text-xs transition shadow-md active:scale-95">
                Entendido
            </button>
        </div>
    </div>

    <!-- Leaflet JS y Lógica Principal Móvil -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
